<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noob_dev</title>
<link rel="icon" href="noob-dev-site/assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D1117;--surface:#161B22;--border:#2A313C;--text:#E6EDF3;--muted:#8B949E;--accent:#A3E635;--accent-ink:#0D1117;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#FAFAF7;--surface:#FFFFFF;--border:#E4E4DE;--text:#14171C;--muted:#5E6570;--accent:#4D7C0F;--accent-ink:#FFFFFF;color-scheme:light}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.7 "IBM Plex Sans Thai",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
main{width:100%;max-width:480px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px}
.logo{font:600 32px/1.3 "IBM Plex Mono",ui-monospace,monospace}
.logo span{color:var(--accent)}
p{color:var(--muted);margin:8px 0 24px}
ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
a{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 20px;border:1px solid var(--border);border-radius:6px;color:var(--text);text-decoration:none;font-weight:500}
a:hover{border-color:var(--accent)}
a.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1 class="logo">noob<span>_</span>dev</h1>
  <p>นักพัฒนาสาย indie ที่ยังเป็นมือใหม่ตลอดไป</p>
  <ul>
    <li><a class="main" href="noob-dev-site/">พอร์ตโฟลิโอ <span aria-hidden="true">→</span></a></li>
    <li><a href="noob-dev-com/">บันทึก <span aria-hidden="true">→</span></a></li>
    <li><a href="noob-dev-com/links.html">ลิงก์รวม <span aria-hidden="true">→</span></a></li>
    <li><a href="https://github.com/coolboy450">GitHub <span aria-hidden="true">→</span></a></li>
  </ul>
</main>
</body>
</html>
